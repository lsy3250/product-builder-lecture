<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />

  <title>그림판</title>

  <script>
    (function () {
      const savedTheme = localStorage.getItem("drawing-app-theme");
      const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";

      document.documentElement.dataset.theme = savedTheme || preferredTheme;
    })();
  </script>

  <style>
    :root {
      color-scheme: light;
      --page-background: #f1f4f8;
      --text-primary: #222222;
      --text-secondary: #555555;
      --text-muted: #666666;
      --surface: #ffffff;
      --surface-muted: #fafafa;
      --surface-hover: #f1f3f6;
      --border: #d3d7de;
      --border-subtle: #eeeeee;
      --accent: #4f62d8;
      --accent-hover: #4354bd;
      --danger: #d53d3d;
      --danger-border: #e45c5c;
      --danger-hover: #fff0f0;
      --success: #21a366;
      --success-hover: #18834f;
      --shadow: rgba(0, 0, 0, 0.12);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-background: #111827;
      --text-primary: #f3f4f6;
      --text-secondary: #d1d5db;
      --text-muted: #9ca3af;
      --surface: #1f2937;
      --surface-muted: #18212f;
      --surface-hover: #374151;
      --border: #4b5563;
      --border-subtle: #374151;
      --accent: #7181ef;
      --accent-hover: #8492f4;
      --danger: #ff8c8c;
      --danger-border: #b95656;
      --danger-hover: #482a31;
      --success: #27a96d;
      --success-hover: #35bd7d;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: var(--page-background);
      color: var(--text-primary);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 18px;
      text-align: center;
      font-size: 32px;
    }

    .drawing-app {
      overflow: hidden;
      background: var(--surface);
      border-radius: 18px;
      box-shadow: 0 10px 35px var(--shadow);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 15px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-group {
      margin-left: auto;
    }

    .tool-label {
      font-size: 14px;
      font-weight: bold;
      color: var(--text-secondary);
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text-primary);
      font-weight: bold;
      cursor: pointer;
      transition:
        background-color 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
    }

    button:hover {
      background: var(--surface-hover);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 2px;
    }

    button:active {
      transform: translateY(1px);
    }

    button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    button.active:hover {
      background: var(--accent-hover);
    }

    button.danger {
      border-color: var(--danger-border);
      color: var(--danger);
    }

    button.danger:hover {
      background: var(--danger-hover);
    }

    button.save {
      border-color: var(--success);
      background: var(--success);
      color: #ffffff;
    }

    button.save:hover {
      background: var(--success-hover);
    }

    .theme-toggle {
      min-width: 118px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .theme-icon {
      font-size: 17px;
      line-height: 1;
    }

    input[type="color"] {
      width: 46px;
      height: 42px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      cursor: pointer;
    }

    input[type="range"] {
      width: 130px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .size-value {
      min-width: 42px;
      font-weight: bold;
      color: var(--accent);
    }

    .canvas-area {
      position: relative;
      width: 100%;
      height: 650px;
      background:
        linear-gradient(#eeeeee 1px, transparent 1px),
        linear-gradient(90deg, #eeeeee 1px, transparent 1px);
      background-size: 25px 25px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #ffffff;
      cursor: crosshair;
      touch-action: none;
    }

    .status {
      padding: 10px 15px;
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-muted);
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease;
    }

    @media (max-width: 700px) {
      .container {
        padding: 10px;
      }

      h1 {
        font-size: 26px;
      }

      .toolbar {
        gap: 9px;
        padding: 12px;
      }

      .tool-group {
        flex-wrap: wrap;
      }

      .theme-group {
        width: 100%;
        margin-left: 0;
      }

      .theme-toggle {
        width: 100%;
      }

      button {
        padding: 8px 11px;
        font-size: 14px;
      }

      .canvas-area {
        height: 520px;
      }

      input[type="range"] {
        width: 100px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>🎨 나만의 그림판</h1>

    <section class="drawing-app">
      <div class="toolbar">
        <div class="tool-group">
          <button id="penButton" class="active" type="button">
            ✏️ 펜
          </button>

          <button id="eraserButton" type="button" title="커서가 지나간 부분만 지웁니다.">
            🧽 부분 지우개
          </button>

          <button id="strokeEraserButton" type="button" title="닿은 선을 한 번에 전체 삭제합니다.">
            ✨ 선 전체 지우개
          </button>
        </div>

        <div class="tool-group">
          <span class="tool-label">색상</span>
          <input
            id="colorPicker"
            type="color"
            value="#222222"
            aria-label="펜 색상"
          />
        </div>

        <div class="tool-group">
          <span class="tool-label">굵기</span>

          <input
            id="brushSize"
            type="range"
            min="1"
            max="50"
            value="6"
            aria-label="펜 굵기"
          />

          <span id="brushSizeValue" class="size-value">
            6px
          </span>
        </div>

        <div class="tool-group">
          <button id="undoButton" type="button">
            ↩️ 되돌리기
          </button>

          <button id="clearButton" class="danger" type="button">
            🗑️ 전체 지우기
          </button>

          <button id="saveButton" class="save" type="button">
            💾 이미지 저장
          </button>
        </div>

        <div class="tool-group theme-group">
          <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            aria-pressed="false"
          >
            <span id="themeIcon" class="theme-icon" aria-hidden="true">🌙</span>
            <span id="themeLabel">다크 모드</span>
          </button>
        </div>
      </div>

      <div class="canvas-area">
        <canvas id="drawingCanvas"></canvas>
      </div>

      <div class="status">
        마우스 또는 손가락으로 자유롭게 그림을 그려보세요.
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("drawingCanvas");
    const context = canvas.getContext("2d");

    const penButton = document.getElementById("penButton");
    const eraserButton = document.getElementById("eraserButton");
    const strokeEraserButton = document.getElementById("strokeEraserButton");
    const colorPicker = document.getElementById("colorPicker");
    const brushSize = document.getElementById("brushSize");
    const brushSizeValue = document.getElementById("brushSizeValue");
    const undoButton = document.getElementById("undoButton");
    const clearButton = document.getElementById("clearButton");
    const saveButton = document.getElementById("saveButton");
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const themeLabel = document.getElementById("themeLabel");

    let isDrawing = false;
    let currentTool = "pen";
    let lastX = 0;
    let lastY = 0;
    let undoStack = [];
    let strokes = [];
    let activeStroke = null;
    let deletedStrokeIds = new Set();
    let nextStrokeId = 1;
    let resizeTimer;

    function updateThemeButton(theme) {
      const isDark = theme === "dark";

      themeToggle.setAttribute("aria-pressed", String(isDark));
      themeToggle.setAttribute(
        "aria-label",
        isDark ? "화이트 모드로 전환" : "다크 모드로 전환"
      );
      themeIcon.textContent = isDark ? "☀️" : "🌙";
      themeLabel.textContent = isDark ? "화이트 모드" : "다크 모드";
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("drawing-app-theme", theme);
      updateThemeButton(theme);
    }

    function toggleTheme() {
      const nextTheme =
        document.documentElement.dataset.theme === "dark" ? "light" : "dark";

      setTheme(nextTheme);
    }

    function resizeCanvas() {
      const canvasArea = canvas.parentElement;

      const pixelRatio = window.devicePixelRatio || 1;
      const width = canvasArea.clientWidth;
      const height = canvasArea.clientHeight;

      canvas.width = width * pixelRatio;
      canvas.height = height * pixelRatio;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      context.lineCap = "round";
      context.lineJoin = "round";

      renderStrokes();
    }

    function getPointerPosition(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function saveUndoState() {
      if (undoStack.length >= 20) {
        undoStack.shift();
      }

      undoStack.push(JSON.stringify(strokes));
    }

    function renderStroke(stroke) {
      if (!stroke.points.length) {
        return;
      }

      context.save();
      context.lineWidth = stroke.width;
      context.lineCap = "round";
      context.lineJoin = "round";
      context.globalCompositeOperation =
        stroke.tool === "eraser" ? "destination-out" : "source-over";
      context.strokeStyle =
        stroke.tool === "eraser" ? "#000000" : stroke.color;

      context.beginPath();
      context.moveTo(stroke.points[0].x, stroke.points[0].y);

      if (stroke.points.length === 1) {
        context.lineTo(
          stroke.points[0].x + 0.01,
          stroke.points[0].y + 0.01
        );
      } else {
        for (let index = 1; index < stroke.points.length; index += 1) {
          context.lineTo(stroke.points[index].x, stroke.points[index].y);
        }
      }

      context.stroke();
      context.restore();
    }

    function renderStrokes() {
      const rect = canvas.getBoundingClientRect();
      context.clearRect(0, 0, rect.width, rect.height);
      strokes.forEach(renderStroke);
    }

    function distanceToSegment(point, start, end) {
      const deltaX = end.x - start.x;
      const deltaY = end.y - start.y;
      const lengthSquared = deltaX * deltaX + deltaY * deltaY;

      if (lengthSquared === 0) {
        return Math.hypot(point.x - start.x, point.y - start.y);
      }

      const amount = Math.max(
        0,
        Math.min(
          1,
          ((point.x - start.x) * deltaX +
            (point.y - start.y) * deltaY) /
            lengthSquared
        )
      );

      return Math.hypot(
        point.x - (start.x + amount * deltaX),
        point.y - (start.y + amount * deltaY)
      );
    }

    function strokeTouchesPoint(stroke, point, eraserRadius) {
      const hitDistance = eraserRadius + stroke.width / 2;

      if (stroke.points.length === 1) {
        return (
          Math.hypot(
            point.x - stroke.points[0].x,
            point.y - stroke.points[0].y
          ) <= hitDistance
        );
      }

      for (let index = 1; index < stroke.points.length; index += 1) {
        if (
          distanceToSegment(
            point,
            stroke.points[index - 1],
            stroke.points[index]
          ) <= hitDistance
        ) {
          return true;
        }
      }

      return false;
    }

    function eraseWholeStrokes(position) {
      const eraserRadius = Number(brushSize.value) / 2;
      let foundStroke = false;

      strokes.forEach(function (stroke) {
        if (
          stroke.tool === "pen" &&
          !deletedStrokeIds.has(stroke.id) &&
          strokeTouchesPoint(stroke, position, eraserRadius)
        ) {
          deletedStrokeIds.add(stroke.id);
          foundStroke = true;
        }
      });

      if (foundStroke) {
        strokes = strokes.filter(function (stroke) {
          return !deletedStrokeIds.has(stroke.id);
        });
        renderStrokes();
      }
    }

    function eraseWholeStrokesAlongPath(start, end) {
      const distance = Math.hypot(end.x - start.x, end.y - start.y);
      const spacing = Math.max(2, Number(brushSize.value) / 3);
      const steps = Math.max(1, Math.ceil(distance / spacing));

      for (let index = 1; index <= steps; index += 1) {
        const amount = index / steps;
        eraseWholeStrokes({
          x: start.x + (end.x - start.x) * amount,
          y: start.y + (end.y - start.y) * amount
        });
      }
    }

    function startDrawing(event) {
      event.preventDefault();

      saveUndoState();

      isDrawing = true;

      const position = getPointerPosition(event);

      lastX = position.x;
      lastY = position.y;

      deletedStrokeIds.clear();

      if (currentTool === "strokeEraser") {
        eraseWholeStrokes(position);
      } else {
        activeStroke = {
          id: nextStrokeId,
          tool: currentTool,
          color: colorPicker.value,
          width: Number(brushSize.value),
          points: [position]
        };
        nextStrokeId += 1;
        strokes.push(activeStroke);
        renderStroke(activeStroke);
      }

      canvas.setPointerCapture(event.pointerId);
    }

    function draw(event) {
      if (!isDrawing) {
        return;
      }

      event.preventDefault();

      const position = getPointerPosition(event);

      if (currentTool === "strokeEraser") {
        eraseWholeStrokesAlongPath(
          { x: lastX, y: lastY },
          position
        );
        lastX = position.x;
        lastY = position.y;
        return;
      }

      context.lineWidth = activeStroke.width;
      context.lineCap = "round";
      context.lineJoin = "round";

      if (currentTool === "eraser") {
        context.globalCompositeOperation = "destination-out";
        context.strokeStyle = "rgba(0, 0, 0, 1)";
      } else {
        context.globalCompositeOperation = "source-over";
        context.strokeStyle = activeStroke.color;
      }

      context.beginPath();
      context.moveTo(lastX, lastY);
      context.lineTo(position.x, position.y);
      context.stroke();

      activeStroke.points.push(position);
      lastX = position.x;
      lastY = position.y;
    }

    function stopDrawing(event) {
      if (!isDrawing) {
        return;
      }

      isDrawing = false;
      context.closePath();
      activeStroke = null;
      deletedStrokeIds.clear();

      if (
        event.pointerId !== undefined &&
        canvas.hasPointerCapture(event.pointerId)
      ) {
        canvas.releasePointerCapture(event.pointerId);
      }
    }

    function selectPen() {
      currentTool = "pen";

      penButton.classList.add("active");
      eraserButton.classList.remove("active");
      strokeEraserButton.classList.remove("active");

      canvas.style.cursor = "crosshair";
    }

    function selectEraser() {
      currentTool = "eraser";

      eraserButton.classList.add("active");
      penButton.classList.remove("active");
      strokeEraserButton.classList.remove("active");

      canvas.style.cursor = "cell";
    }

    function selectStrokeEraser() {
      currentTool = "strokeEraser";

      strokeEraserButton.classList.add("active");
      penButton.classList.remove("active");
      eraserButton.classList.remove("active");

      canvas.style.cursor = "not-allowed";
    }

    function clearCanvas() {
      const shouldClear = confirm("그림을 모두 지우시겠습니까?");

      if (!shouldClear) {
        return;
      }

      saveUndoState();
      strokes = [];
      renderStrokes();
    }

    function undo() {
      if (undoStack.length === 0) {
        alert("되돌릴 내용이 없습니다.");
        return;
      }

      strokes = JSON.parse(undoStack.pop());
      renderStrokes();
    }

    function saveImage() {
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;

      const exportContext = exportCanvas.getContext("2d");

      exportContext.fillStyle = "#ffffff";
      exportContext.fillRect(
        0,
        0,
        exportCanvas.width,
        exportCanvas.height
      );

      exportContext.drawImage(canvas, 0, 0);

      const link = document.createElement("a");

      const date = new Date();
      const fileName =
        "my-drawing-" +
        date.getFullYear() +
        "-" +
        String(date.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(date.getDate()).padStart(2, "0") +
        ".png";

      link.download = fileName;
      link.href = exportCanvas.toDataURL("image/png");
      link.click();
    }

    penButton.addEventListener("click", selectPen);
    eraserButton.addEventListener("click", selectEraser);
    strokeEraserButton.addEventListener("click", selectStrokeEraser);
    themeToggle.addEventListener("click", toggleTheme);

    brushSize.addEventListener("input", function () {
      brushSizeValue.textContent = brushSize.value + "px";
    });

    undoButton.addEventListener("click", undo);
    clearButton.addEventListener("click", clearCanvas);
    saveButton.addEventListener("click", saveImage);

    canvas.addEventListener("pointerdown", startDrawing);
    canvas.addEventListener("pointermove", draw);
    canvas.addEventListener("pointerup", stopDrawing);
    canvas.addEventListener("pointercancel", stopDrawing);
    canvas.addEventListener("pointerleave", stopDrawing);

    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(function () {
        resizeCanvas();
      }, 150);
    });

    updateThemeButton(document.documentElement.dataset.theme);
    resizeCanvas();
  </script>
</body>
</html>
